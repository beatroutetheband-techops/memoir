<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 5 - CTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      background-color: #0A0A0D;
      color: #FAF9F6;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 90px 80px;
    }
    .glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 850px;
      height: 850px;
      background: radial-gradient(circle, rgba(200, 169, 106, 0.15) 0%, transparent 65%);
      pointer-events: none;
      filter: blur(50px);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(200, 169, 106, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200, 169, 106, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-b: 1px solid rgba(200, 169, 106, 0.2);
      padding-bottom: 32px;
      position: relative;
      z-index: 10;
    }
    .brand-logos {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-memoir { height: 44px; width: auto; object-fit: contain; }
    .divider { height: 24px; width: 1px; background-color: rgba(200, 169, 106, 0.35); }
    .logo-beatroute { height: 30px; width: auto; object-fit: contain; opacity: 0.9; }

    .main-body {
      position: relative;
      z-index: 10;
      margin-top: 60px;
      text-center: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C8A96A;
      margin-bottom: 24px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.2;
      color: #FAF9F6;
      margin-bottom: 44px;
      text-align: center;
    }

    /* Primary CTA Button Box */
    .cta-button {
      background: linear-gradient(135deg, #E5C88B 0%, #C8A96A 60%, #A88746 100%);
      color: #0A0A0D;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 28px 56px;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(200, 169, 106, 0.3);
      margin-bottom: 56px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    /* Contact Details Grid */
    .contacts-grid {
      display: flex;
      gap: 36px;
      align-items: center;
      font-size: 15px;
      font-weight: 500;
      color: #D1D5DB;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .contact-icon {
      color: #C8A96A;
    }

    .footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-t: 1px solid rgba(200, 169, 106, 0.2);
      padding-top: 32px;
    }
    .footer-brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #C8A96A;
    }
    .slide-count {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: rgba(250, 249, 246, 0.4);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <!-- Header -->
  <div class="header">
    <div class="brand-logos">
      <img src="../../public/memoir.png" class="logo-memoir" alt="Memoir">
      <div class="divider"></div>
      <img src="../../public/logo.png" class="logo-beatroute" alt="BeatRoute">
    </div>
  </div>

  <!-- Main Body -->
  <div class="main-body">
    <div class="badge">Commission Your Soundtrack</div>
    <h2 class="title">Ready To Turn Your Memory Into Music?</h2>

    <div class="cta-button">
      <span>Tap Link In Bio To Begin</span>
      <span>&rarr;</span>
    </div>

    <div class="contacts-grid">
      <div class="contact-item">
        <span class="contact-icon">&phone;</span>
        <span>+91 81480 66421</span>
      </div>
      <div class="contact-item">
        <span class="contact-icon">&#9993;</span>
        <span>beatroutetheband@gmail.com</span>
      </div>
      <div class="contact-item">
        <span class="contact-icon">&#9733;</span>
        <span>@beat.route_</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-brand">Memoir by BeatRoute Band</div>
    <div class="slide-count">05 / 05</div>
  </div>
</body>
</html>
